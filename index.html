<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mía 🖤</title>
    <style>
        /* Aquí le damos el estilo Blanco y Negro que le gusta */
        body {
            background-color: #000000; /* Fondo negro */
            color: #ffffff; /* Letras blancas */
            font-family: 'Courier New', Courier, monospace; /* Letra tipo máquina de escribir/película */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        #contenedor {
            max-width: 600px;
            padding: 20px;
            border: 2px solid #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .boton {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .boton:hover {
            background-color: #cccccc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="contenedor">
        <h1>OPERACIÓN: MÍA</h1>
        <p>Dicen que los detalles lo son todo. <br><br>
        Para descubrir el mensaje clasificado que tengo para ti, primero debes demostrar que nuestras mentes están conectadas superando una pequeña prueba.</p>
        
        <!-- Este botón aún no hace nada, le daremos vida en la Parte 2 -->
        <button class="boton" id="btn-iniciar">Aceptar el reto</button>
    </div>

</body>
</html>
